# Local services for the Nexoris Technologies platform.
#
# One PostgreSQL server (with the pgvector extension) hosting a database per app, and one
# Meilisearch instance. Official images with pinned tags. No CDN: media is served from the
# VPS filesystem in production, so it is not modelled here.
#
# Usage: from the repository root, `docker compose -f infra/docker-compose.yml up -d`.
# Requires Docker to be installed on the machine.

name: nexoris

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexoris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexoris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # The init script creates nexoris_cms, nexoris_oge, and nexoris_admin and enables
      # pgvector on nexoris_oge.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexoris} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: nexoris-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-change-me-meili-master-key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  meili-data:
