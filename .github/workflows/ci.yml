name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The SEO and accessibility gates block merges, asserting every rule across every route.
      - name: SEO gate (check:seo)
        run: pnpm check:seo

      - name: Accessibility gate (check:a11y)
        run: pnpm check:a11y

      # Route-level a11y and the Lighthouse budgets run against the built site in a real browser.
      - name: Install Playwright Chromium
        run: pnpm --filter @nexoris/web exec playwright install --with-deps chromium

      - name: Route accessibility pass (Playwright axe)
        run: pnpm --filter @nexoris/web test:a11y

      - name: Lighthouse budgets (Core Web Vitals)
        run: pnpm --filter @nexoris/web lhci
